name: sudoku

services:
  frontend:
    build:
      context: .
      dockerfile: .docker/nginx/Dockerfile
    container_name: sudoku_frontend
    restart: unless-stopped
    networks:
      - sudoku-network
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sudoku.rule=Host(`sudoku.etienne-scherrer.ch`)"
      - "traefik.http.routers.sudoku.entrypoints=websecure"
      - "traefik.http.routers.sudoku.tls.certresolver=letsencrypt"
      - "traefik.http.services.sudoku.loadbalancer.server.port=80"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: .docker/python/Dockerfile
    container_name: sudoku_backend
    restart: unless-stopped
    networks:
      - sudoku-network
    environment:
      API_KEY: ${API_KEY:-}

networks:
  sudoku-network:
    driver: bridge
  traefik:
    name: traefik
    external: true
